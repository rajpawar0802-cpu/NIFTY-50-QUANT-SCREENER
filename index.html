<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nifty 50 Quantitative Screener & Portfolio</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-900 text-slate-100 min-h-screen p-6">
    <div class="max-w-7xl mx-auto">
        <header class="mb-8 border-b border-slate-800 pb-4 flex justify-between items-center">
            <div>
                <h1 class="text-3xl font-bold tracking-tight text-emerald-400">Nifty 50 Quant Screener</h1>
                <p class="text-slate-400 text-sm mt-1">Automated Factor Investing Dashboard (Value, Momentum & Quality)
                </p>
            </div>
            <span
                class="bg-emerald-950 text-emerald-400 text-xs px-3 py-1 rounded-full border border-emerald-800 font-mono">Live
                Pipeline</span>
        </header>

        <!-- Table Container -->
        <div class="bg-slate-800 rounded-xl shadow-xl overflow-hidden border border-slate-700">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse" id="stock-table">
                    <thead>
                        <tr
                            class="bg-slate-900/50 text-slate-400 text-xs uppercase tracking-wider border-b border-slate-700">
                            <th class="p-4">Rank</th>
                            <th class="p-4">Ticker</th>
                            <th class="p-4">P/E</th>
                            <th class="p-4">Close (₹)</th>
                            <th class="p-4">50 SMA</th>
                            <th class="p-4">RSI</th>
                            <th class="p-4">MACD Bullish</th>
                            <th class="p-4">Vol Surge</th>
                            <th class="p-4">ROE (%)</th>
                            <th class="p-4">MCap (B ₹)</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-slate-700/50 text-sm font-mono" id="table-body">
                        <!-- Data injected dynamically via stocks.js -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Load Data and Render Table -->
    <script src="stocks.js"></script>
    <script>
        const tbody = document.getElementById('table-body');
        if (window.STOCK_DATA && window.STOCK_DATA.length > 0) {
            window.STOCK_DATA.forEach(row => {
                const tr = document.createElement('tr');
                tr.className = "hover:bg-slate-700/30 transition-colors";
                tr.innerHTML = `
                    <td class="p-4 text-emerald-400 font-bold">${row.Rank}</td>
                    <td class="p-4 font-bold text-white">${row.Ticker}</td>
                    <td class="p-4">${row.Trailing_PE ? row.Trailing_PE.toFixed(2) : 'N/A'}</td>
                    <td class="p-4">₹${row.Close ? row.Close.toFixed(2) : 'N/A'}</td>
                    <td class="p-4">₹${row.SMA_50 ? row.SMA_50.toFixed(2) : 'N/A'}</td>
                    <td class="p-4">${row.RSI_14 ? row.RSI_14.toFixed(2) : 'N/A'}</td>
                    <td class="p-4"><span class="px-2 py-1 rounded text-xs ${row.MACD_Bullish ? 'bg-emerald-900/50 text-emerald-400 border border-emerald-700' : 'bg-rose-900/50 text-rose-400 border border-rose-700'}">${row.MACD_Bullish}</span></td>
                    <td class="p-4"><span class="px-2 py-1 rounded text-xs ${row.Vol_Breakout ? 'bg-emerald-900/50 text-emerald-400 border border-emerald-700' : 'bg-slate-700 text-slate-300'}">${row.Vol_Breakout}</span></td>
                    <td class="p-4">${row.ROE ? row.ROE.toFixed(2) + '%' : 'N/A'}</td>
                    <td class="p-4">₹${row.Market_Cap_B ? row.Market_Cap_B.toFixed(2) : '0'}B</td>
                `;
                tbody.appendChild(tr);
            });
        } else {
            tbody.innerHTML = `<tr><td colspan="10" class="p-6 text-center text-slate-400">No stock data found. Please check your stocks.js file.</td></tr>`;
        }
    </script>
</body>

</html>
